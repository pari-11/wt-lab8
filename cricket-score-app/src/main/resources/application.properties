spring.application.name=cricket-score-app
server.port=8080

# SSE connections stay open indefinitely
spring.mvc.async.request-timeout=-1

# Seed teams, players and a few matches (live, upcoming, completed) on startup
cricket.seed.enabled=true

# Live match simulator: bowls one delivery in every live match per tick
cricket.simulator.enabled=true
cricket.simulator.interval-ms=3000
# Start upcoming matches automatically once their start time has passed
cricket.simulator.auto-start-upcoming=true

logging.level.com.wtlab.cricket=INFO
